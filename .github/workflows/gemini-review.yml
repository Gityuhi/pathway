name: Gemini PR Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'supabase/**'

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Get PR Diff
        id: diff
        run: |
          # shallow fetch では three-dot diff の merge base が取れないため、
          # PR イベントの base/head SHA を直接比較する（merge base 不要）
          git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}
          git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- \
            backend/ \
            frontend/ \
            supabase/ > pr_diff.txt
          if [ ! -s pr_diff.txt ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure Gemini review instructions
        if: steps.diff.outputs.skip != 'true'
        run: |
          mkdir -p .gemini
          echo 'GEMINI_SYSTEM_MD=.github/copilot-instructions.md' > .gemini/.env

      - name: Run Gemini CLI Review
        if: steps.diff.outputs.skip != 'true'
        id: gemini_review
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-2.5-pro
          workflow_name: gemini-review
          github_pr_number: '${{ github.event.pull_request.number }}'
          prompt: |
            以下の Pull Request 差分をレビューしてください: @pr_diff.txt

            差分に含まれる領域（backend / frontend / supabase）のみレビューしてください。
            レビューはすべて日本語で記述してください。
            特に問題がない場合は「Good job! 特に見つかりませんでした。」とだけ返してください。

      - name: Comment on PR
        if: steps.diff.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          REVIEW_BODY: ${{ steps.gemini_review.outputs.summary }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "### 🤖 Geminiによるコードレビュー結果\n\n" + process.env.REVIEW_BODY
            });
